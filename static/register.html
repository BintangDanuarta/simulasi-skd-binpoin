<!doctype html>
<html lang="id"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Daftar akun Simulasi SKD by Binpoin">
<title>Daftar · Simulasi SKD</title><link rel="stylesheet" href="style.css">
</head><body>
<main class="auth-shell"><section class="auth-card card">
<img src="binpoin-logo.png" alt="Binpoin" class="auth-logo">
<p class="eyebrow">BINPOIN · SIMULASI SKD</p><h1>Buat akun</h1>
<p class="card-sub">Buat akun untuk menyimpan progres belajar, sesi ujian, dan riwayat latihanmu.</p>
<form id="auth-form">
<label class="field-label" for="email">Email</label><input id="email" class="form-control" type="email" autocomplete="email" required maxlength="254">
<label class="field-label" for="password">Password</label><input id="password" class="form-control" type="password" autocomplete="new-password" required minlength="12" maxlength="256">
<p id="error" class="auth-error hidden" role="alert"></p><button id="submit" class="btn btn-primary btn-block">Buat akun</button>
</form>
<p class="auth-links">Sudah punya akun? <a href="login">Masuk</a></p>
<small class="auth-note">Gunakan kata sandi minimal 12 karakter. Jangan gunakan kata sandi yang sama dengan akun penting lainnya.</small>
</section></main>
<script src="auth.js"></script></body></html>
