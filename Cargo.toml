[package]
name = "simulasi-skd-binpoin"
version = "0.1.0-beta.1"
default-run = "simulasi-skd-binpoin"
authors = ["Binpoin"]
description = "Simulasi SKD by Binpoin"
license = "Proprietary"

edition = "2024"

[dependencies]
base64 = "0.22"
axum = "0.8.9"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
tower-http = { version = "0.7", features = ["fs", "cors", "limit"] }
argon2 = "0.5"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "migrate", "macros", "json", "uuid"] }
rand_core = { version = "0.6", features = ["getrandom"] }
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1", features = ["v4", "serde"] }
tauri = { version = "2", optional = true }
tauri-plugin-updater = { version = "2", optional = true }
tauri-plugin-process = { version = "2.4.0", optional = true }

[features]
desktop = ["dep:tauri", "dep:tauri-plugin-updater", "dep:tauri-plugin-process"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[[bin]]
name = "simulasi-skd-binpoin"
path = "src/main.rs"

[[bin]]
name = "simulasi-skd-binpoin-desktop"
path = "src/desktop.rs"
required-features = ["desktop"]
