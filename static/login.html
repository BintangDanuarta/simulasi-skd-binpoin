<!doctype html>
<html lang="id"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Masuk ke Simulasi SKD by Binpoin">
<title>Masuk · Simulasi SKD</title><link rel="stylesheet" href="style.css">
</head><body>
<main class="auth-shell"><section class="auth-card card">
<img src="binpoin-logo.png" alt="Binpoin" class="auth-logo">
<p class="eyebrow">BINPOIN · SIMULASI SKD</p><h1>Masuk</h1>
<p class="card-sub">Masuk untuk melanjutkan belajar dan melihat progres serta riwayat latihanmu.</p>
<form id="auth-form">
<label class="field-label" for="email">Email</label><input id="email" class="form-control" type="email" autocomplete="email" required maxlength="254">
<label class="field-label" for="password">Password</label><input id="password" class="form-control" type="password" autocomplete="current-password" required minlength="12" maxlength="256">
<p id="error" class="auth-error hidden" role="alert"></p><button id="submit" class="btn btn-primary btn-block">Masuk</button>
</form>
<p class="auth-links">Belum punya akun? <a href="register">Daftar</a></p>
<small class="auth-note">Gunakan kata sandi akun Simulasi SKD-mu. Jangan bagikan kata sandi kepada siapa pun.</small>
</section></main>
<script src="auth.js"></script></body></html>
