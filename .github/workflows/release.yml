name: Build beta desktop packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            platform: darwin-aarch64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve release version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.1.0-beta.3" >> "$GITHUB_OUTPUT"
          fi
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install desktop tooling
        run: npm ci
      - name: Stage Windows app data and desktop frontend
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo build --release --locked --target "${{ matrix.target }}"
          New-Item -ItemType Directory -Force bundle/backend, bundle/data, bundle/static, release | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/simulasi-skd-binpoin.exe" "bundle/backend/simulasi-skd-binpoin.exe" -Force
          Copy-Item data/questions.json, data/materi.json, data/video.json bundle/data/ -Force
          Copy-Item static/app.js, static/index.html, static/style.css, static/binpoin-logo.png, static/favicon.ico bundle/static/ -Force
          npm run build:desktop-frontend
          Copy-Item static/desktop-update.bundle.js bundle/static/ -Force
      - name: Package macOS
        if: runner.os == 'macOS'
        shell: bash
        run: VERSION="${{ steps.version.outputs.version }}" ./build-release.sh "${{ matrix.target }}"
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - name: Verify updater signing secrets
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) { throw 'TAURI_SIGNING_PRIVATE_KEY is not configured.' }
          if ($null -eq $env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD) { throw 'TAURI_SIGNING_PRIVATE_KEY_PASSWORD is not configured.' }
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - name: Prepare Windows release output
        if: runner.os == 'Windows'
        shell: pwsh
        run: New-Item -ItemType Directory -Force release | Out-Null
      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:TAURI_SIGNING_PRIVATE_KEY = '${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}'
          $env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD = '${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}'
          $version = '${{ steps.version.outputs.version }}'
          $env:VERSION = $version
          $configPath = Join-Path $env:RUNNER_TEMP 'tauri-test-config.json'
          @{ version = $version } | ConvertTo-Json -Compress | Set-Content -Path $configPath -Encoding utf8
          npx --yes @tauri-apps/cli build --features desktop,custom-protocol --target "${{ matrix.target }}" --bundles nsis --config $configPath
          if ($LASTEXITCODE -ne 0) { throw "Tauri build failed with exit code $LASTEXITCODE" }
          $setup = Get-ChildItem "target/${{ matrix.target }}/release/bundle/nsis" -Filter "*.exe" | Select-Object -First 1
          if (-not $setup) { throw 'Tauri NSIS installer was not generated.' }
          Copy-Item $setup.FullName "release/simulasi-skd-binpoin-$version-${{ matrix.target }}-setup.exe"
          $signed = Get-ChildItem "target/${{ matrix.target }}/release/bundle" -Recurse -Filter "*.nsis.zip" | Select-Object -First 1
          if (-not $signed) { throw 'Tauri updater archive was not generated.' }
          $asset = "simulasi-skd-binpoin-$version-${{ matrix.platform }}.nsis.zip"
          Copy-Item $signed.FullName "release/$asset"
          if (-not (Test-Path "$($signed.FullName).sig")) { throw 'Signed NSIS updater signature was not generated.' }
          Copy-Item "$($signed.FullName).sig" "release/$asset.sig"
          $signature = Get-Content "release/$asset.sig" -Raw
          $manifest = @{
            version = $version
            notes = "Simulasi SKD by Binpoin $version"
            pub_date = (Get-Date).ToUniversalTime().ToString('o')
            platforms = @{
              '${{ matrix.platform }}' = @{
                url = "https://github.com/BintangDanuarta/simulasi-skd-binpoin/releases/download/v$version/$asset"
                signature = $signature.Trim()
              }
            }
          } | ConvertTo-Json -Depth 6
          Set-Content -Path "release/latest-${{ matrix.platform }}.json" -Value $manifest -Encoding utf8
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: Simulasi-SKD-Binpoin-${{ matrix.target }}
          path: |
            release/**
      - name: Publish tagged beta
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: false
          files: |
            release/**
          fail_on_unmatched_files: false
          generate_release_notes: true
